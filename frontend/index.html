<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: lets the layout use env(safe-area-inset-*) under the notch and home bar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F3F4F7" />
    <meta name="description" content="Which errors happen when, which cost the most, and how to fix them." />
    <!-- iOS home-screen app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OEE Engine" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/pwa-192.png" />
    <title>OEE Engine</title>
    <!-- Before the first paint, so a dark-theme phone never flashes white. Same keys as src/lib/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem("oee-engine.theme");
        // Anything but an explicit choice is Auto: follow the phone.
        if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
